# Construction, analyse de sécurité, test de démarrage et (si demandé) publication de l'image
# sur Docker Hub. Workflow réutilisable : appelé par la CI (demandes de fusion et main) et par
# la publication des versions.
#
# Étapes :
# 1. construction de l'image en local ;
# 2. analyse Trivy : on bloque si une faille critique ou haute a un correctif disponible ;
# 3. démarrage durci du conteneur et attente de la sonde de santé ;
# 4. si push = true : publication sur Docker Hub avec SBOM et attestation de provenance,
#    puis signature cosign de l'image publiée.
name: Image Docker

on:
  workflow_call:
    inputs:
      push:
        description: Publier l'image sur Docker Hub.
        type: boolean
        default: false
      version:
        description: Numéro de version (ex. 1.2.3) pour les étiquettes de version ; vide hors publication de version.
        type: string
        default: ""
    secrets:
      DOCKERHUB_USERNAME:
        required: false
      DOCKERHUB_TOKEN:
        required: false
      COSIGN_PRIVATE_KEY:
        required: false
      COSIGN_PASSWORD:
        required: false
    outputs:
      digest:
        description: Empreinte de l'image publiée.
        value: ${{ jobs.image.outputs.digest }}

permissions: {}

env:
  IMAGE: docker.io/gambijul/sudoklash

jobs:
  image:
    name: Construction, analyse et publication
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Étiquettes et métadonnées OCI
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=sha,format=long
            type=raw,value=edge,enable=${{ inputs.version == '' && github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.version }},enable=${{ inputs.version != '' }}
            type=semver,pattern={{major}},value=${{ inputs.version }},enable=${{ inputs.version != '' && !startsWith(inputs.version, '0.') }}
            type=raw,value=latest,enable=${{ inputs.version != '' }}
          labels: |
            org.opencontainers.image.title=Sudoku Clash
            org.opencontainers.image.description=Sudoku Clash auto-hébergé : serveur Next.js et base SQLite
            org.opencontainers.image.vendor=Sudoku Clash
          annotations: |
            org.opencontainers.image.title=Sudoku Clash
            org.opencontainers.image.description=Sudoku Clash auto-hébergé : serveur Next.js et base SQLite

      # Les réglages Supabase publics (NEXT_PUBLIC_*) gardent leurs valeurs par défaut
      # (lib/supabase-config.ts) : l'image publiée vise le projet Supabase officiel.
      - name: Construction pour analyse
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          pull: true # Dernier correctif des images de base, même si le cache en contient une plus ancienne.
          platforms: linux/amd64
          load: true
          push: false
          tags: sudoklash:analyse
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Les failles acceptées (sans correctif ou sans impact) se déclarent dans .trivyignore.yaml,
      # avec une justification et une date d'expiration.
      - name: Analyse de sécurité (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: sudoklash:analyse
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .trivyignore.yaml
          format: table
          output: trivy.txt
          exit-code: "1"

      - name: Résumé de l'analyse
        if: ${{ !cancelled() }}
        # Le rapport va aussi dans le journal du job, lisible sans ouvrir le résumé.
        run: |
          cat trivy.txt 2>/dev/null || echo "Pas de rapport."
          {
            echo "### Analyse Trivy de l'image (failles critiques et hautes avec correctif)"
            echo '```'
            cat trivy.txt 2>/dev/null || echo "Pas de rapport."
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Mêmes réglages de durcissement que docker-compose.yml : on ne publie qu'une image qui
      # démarre en lecture seule, sans capacités, et dont la sonde /api/health répond.
      - name: Démarrage durci et sonde de santé
        run: |
          docker run -d --name sudoklash --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000 \
            -p 127.0.0.1:3000:3000 sudoklash:analyse
          status=starting
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sudoklash)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sudoklash
          test "$status" = healthy
          curl -fsS http://127.0.0.1:3000/api/health
          docker rm -f sudoklash > /dev/null

      - name: Connexion à Docker Hub
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Même construction (servie par le cache), publiée avec l'inventaire des composants
      # (SBOM) et l'attestation de provenance SLSA attachés à l'image.
      - name: Publication
        id: publish
        if: inputs.push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: Dockerfile
          pull: true # Dernier correctif des images de base, même si le cache en contient une plus ancienne.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: inputs.push

      # Signature par clé : rien n'est envoyé au journal public Rekor.
      - name: Signature de l'image (cosign)
        if: inputs.push
        env:
          COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
          COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: |
          if [ -z "$COSIGN_PRIVATE_KEY" ]; then
            echo "::error title=Signature impossible::Le secret COSIGN_PRIVATE_KEY est absent : l'image ${IMAGE}@${DIGEST} est publiée mais pas signée."
            exit 1
          fi
          # Configuration de signature vide : ni journal de transparence (Rekor), ni
          # horodatage ou certificat externes. La signature reste entre la CI et Docker Hub.
          cosign signing-config create --out "${RUNNER_TEMP}/signing-config.json"
          cosign sign --yes --key env://COSIGN_PRIVATE_KEY \
            --signing-config "${RUNNER_TEMP}/signing-config.json" "${IMAGE}@${DIGEST}"

      # cosign 3 signe au format « bundle » Sigstore, rangé comme référent OCI de l'image :
      # la vérification doit chercher ce format, sinon elle ne trouve aucune signature.
      - name: Vérification de la signature
        if: inputs.push
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
        run: cosign verify --key cosign.pub --new-bundle-format --insecure-ignore-tlog=true "${IMAGE}@${DIGEST}" > /dev/null

      - name: Résumé de la publication
        if: inputs.push
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          {
            echo "### Image publiée"
            echo "Empreinte : \`${IMAGE}@${DIGEST}\`"
            echo
            echo "Étiquettes :"
            echo '```'
            echo "$TAGS"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
