name: Build

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]

# A new push to a pull request cancels the analysis still going for the previous commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and analyze
    # Dependabot ne reçoit pas les secrets Actions (SONAR_TOKEN, SONAR_HOST_URL) : sans eux le
    # scanner échoue (« URI with undefined scheme »). L'analyse a lieu sur main après la fusion.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The coverage report (coverage/lcov.info) is passed to SonarQube.
      - run: pnpm test:coverage
      # The scanner downloads its Java runtime and the server's analyzers into ~/.sonar/cache
      # (about 30 s). Files there are named by their hash: an outdated entry is never used, and
      # the monthly key keeps the cache from growing for ever.
      - name: Month of the Sonar cache
        id: month
        run: echo "month=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.sonar/cache
          key: sonar-${{ runner.os }}-${{ steps.month.outputs.month }}
          restore-keys: sonar-${{ runner.os }}-
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4 # v8.5.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
