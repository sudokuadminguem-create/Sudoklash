name: Dependency audit

# New advisories appear without any change to the code, so this also runs every week.
on:
  schedule:
    - cron: "17 6 * * 1"
  pull_request:
    paths: [package.json, pnpm-lock.yaml]
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Blocks on a critical advisory in what ships to production.
      - name: Production dependencies (critical fails the job)
        run: pnpm audit --prod --audit-level=critical
      # Everything else is reported, not blocking: most of it is build tooling.
      - name: All dependencies (report only)
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Dependency audit (high and above, including dev tools)"
            echo '```'
            pnpm audit --audit-level=high || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
