name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test:coverage
      - name: Show coverage in the job summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # Only the files a pull request touches must be formatted: the rest of the code base is not
  # formatted yet, and reformatting it all at once would bury real changes.
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the formatting of the changed files
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" \
            | grep -E '\.(ts|tsx|mjs|json|css|md|ya?ml)$' || true)
          if [ -z "$files" ]; then echo "No files to check."; exit 0; fi
          echo "$files" | xargs pnpm exec prettier --check

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image
        run: docker build -t sudoklash:ci .
      - name: Start it hardened and wait for the health check
        run: |
          docker run -d --name sudoklash --read-only --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --tmpfs /tmp --tmpfs /app/.next/cache:uid=1000,gid=1000 \
            -p 3000:3000 sudoklash:ci
          for i in $(seq 1 30); do
            status=$(docker inspect -f '{{.State.Health.Status}}' sudoklash)
            [ "$status" = healthy ] && break
            sleep 2
          done
          docker logs sudoklash
          test "$status" = healthy
          curl -fsS http://127.0.0.1:3000/api/health
