name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a pull request cancels the run still going for the previous commit. On main,
# every commit keeps its own run: each one publishes its image.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test:coverage
      # Checking every grid of the variant bank means solving it: ten times slower under coverage
      # instrumentation, and it checks data, not code (coverage is the same without it). So it
      # runs here on its own, without coverage.
      - run: pnpm test:banks
      - name: Show coverage in the job summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7

  # Only the files a pull request touches must be formatted: the rest of the code base is not
  # formatted yet, and reformatting it all at once would bury real changes.
  format:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the formatting of the changed files
        env:
          BASE: origin/${{ github.base_ref }}
        run: |
          files=$(git diff --name-only --diff-filter=ACMR "$BASE...HEAD" \
            | grep -E '\.(ts|tsx|mjs|json|css|md|ya?ml)$' || true)
          if [ -z "$files" ]; then echo "No files to check."; exit 0; fi
          echo "$files" | xargs pnpm exec prettier --check

  e2e:
    # Playwright 1.56 cannot install Chromium on Ubuntu 26.04, which ubuntu-latest now points to.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The browser is kept between runs for a given Playwright version.
      - name: Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # No --with-deps: the runner already has the libraries Chromium needs (Google Chrome is
      # installed on it). --with-deps only added Asian fonts and minor updates through apt, and
      # took up to 5 minutes whenever the Ubuntu mirror was slow. No test compares screenshots.
      - run: pnpm exec playwright install chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # Construction, analyse Trivy et test de démarrage à chaque demande de fusion ; sur main,
  # publication en plus sur Docker Hub (étiquettes edge et sha-<commit>).
  docker:
    permissions:
      contents: read
    uses: ./.github/workflows/docker-image.yml
    with:
      push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      COSIGN_PRIVATE_KEY: ${{ secrets.COSIGN_PRIVATE_KEY }}
      COSIGN_PASSWORD: ${{ secrets.COSIGN_PASSWORD }}
